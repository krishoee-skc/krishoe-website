<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;600;700&family=Tiro+Devanagari+Hindi&family=Mukta:wght@400;600;700&display=swap">
  <style>
    body { margin: 0; background: #F4F2ED; }
    a { color: #B98A2E; } a:hover { color: #9A6B08; }
    .devdisp { font-family: "Tiro Devanagari Hindi", "Fraunces", Georgia, serif; }
    .disp { font-family: "Fraunces", Georgia, serif; }
    .body { font-family: "Inter", "Mukta", "Segoe UI", Arial, sans-serif; }
    .dev { font-family: "Mukta", "Inter", "Segoe UI", Arial, sans-serif; }
  </style>
</helmet>

<div class="body" style="width: 390px; height: 844px; display: flex; flex-direction: column; box-sizing: border-box; background: #F4F2ED; color: #10231D; letter-spacing: 0.3px; overflow: hidden;">

  <header style="background: #10231D; padding: 16px 18px 15px;">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="width: 32px; height: 32px; border-radius: 999px; border: 1px solid rgba(200,160,77,0.55); display: inline-flex; align-items: center; justify-content: center; color: #C8A04D; font-weight: 700; font-size: 14px;">K</span>
        <div>
          <p class="body" style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 2.6px; color: #FFFFFF;">KRISHOE</p>
          <p class="dev" style="margin: 0; font-size: 10px; color: #7d8d85;">मालिक</p>
        </div>
      </div>
      <div style="display: inline-flex; align-items: stretch; height: 32px; border: 1px solid #C8A04D; border-radius: 999px; overflow: hidden;">
        <span class="dev" style="display: inline-flex; align-items: center; padding: 0 13px; font-size: 13px; font-weight: 700; background: #C8A04D; color: #10231D;">ने</span>
        <span class="body" style="display: inline-flex; align-items: center; padding: 0 13px; font-size: 13px; font-weight: 700; color: #9baba3;">EN</span>
      </div>
    </div>
  </header>

  <main style="flex-grow: 1; padding: 20px 18px 0; overflow: hidden;">
    <p class="body" style="margin: 0; font-size: 10px; font-weight: 700; letter-spacing: 2.2px; text-transform: uppercase; color: #B98A2E;">२०८३ भदौ ९</p>
    <h1 class="devdisp" style="margin: 7px 0 0; font-size: 25px; font-weight: 700; line-height: 1.2; color: #10231D;">नमस्कार गुरु</h1>

    <!-- The one number, same as PC -->
    <div style="margin-top: 16px; border-radius: 18px; background: #10231D; padding: 22px 24px;">
      <p class="dev" style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 1.2px; color: #9baba3;">आज बिक्री भयो</p>
      <p class="disp" style="margin: 7px 0 0; font-size: 42px; font-weight: 700; line-height: 1; color: #FFFFFF;">रु. ४,२००</p>
      <p class="dev" style="margin: 9px 0 0; font-size: 12px; color: #cbd8d1;">२ बिल · ४ जोडी · सबै नगद</p>
    </div>

    <!-- Needs you: stacked on a phone, not squeezed -->
    <p class="dev" style="margin: 20px 0 10px; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: #6B6459;">तपाईंले हेर्नुपर्ने</p>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 14px; border-radius: 14px; background: #FDFBF7; border: 1px solid #C8A04D; padding: 16px 18px;">
      <div style="flex-grow: 1;">
        <p class="dev" style="margin: 0; font-size: 14px; font-weight: 700; color: #7A5A00;">स्टक सकिएको</p>
        <p class="dev" style="margin: 4px 0 0; font-size: 12px; line-height: 1.5; color: #6B6459;">७ मध्ये ४ जुत्ता "सकियो" देखिन्छ</p>
      </div>
      <p class="disp" style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1; color: #10231D;">४</p>
    </div>

    <div style="margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 14px; border-radius: 14px; background: #FDFBF7; border: 1px solid #E4DFD5; padding: 16px 18px;">
      <div style="flex-grow: 1;">
        <p class="dev" style="margin: 0; font-size: 14px; font-weight: 700; color: #10231D;">विवरण खाली</p>
        <p class="dev" style="margin: 4px 0 0; font-size: 12px; line-height: 1.5; color: #6B6459;">विवरण नभएको जुत्ता कमै बिक्छ</p>
      </div>
      <p class="disp" style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1; color: #10231D;">७</p>
    </div>

    <div style="margin-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 14px; border-radius: 14px; background: #FDFBF7; border: 1px solid #E4DFD5; padding: 16px 18px;">
      <div style="flex-grow: 1;">
        <p class="dev" style="margin: 0; font-size: 14px; font-weight: 700; color: #10231D;">कामदार app मा</p>
        <p class="dev" style="margin: 4px 0 0; font-size: 12px; line-height: 1.5; color: #6B6459;">बाँकी १७ जनाको ज्याला हातले</p>
      </div>
      <p class="disp" style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1; color: #10231D;">८<span style="font-size: 17px; color: #8A958F;">/२५</span></p>
    </div>
  </main>

  <!-- Bottom bar: thumb reach, 56px targets -->
  <nav style="display: flex; align-items: stretch; background: #FDFBF7; border-top: 1px solid #E4DFD5; padding: 8px 6px 22px;">
    <span style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0B4D3B" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span class="dev" style="font-size: 11px; font-weight: 700; color: #0B4D3B;">आज</span>
    </span>
    <span style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8A958F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      <span class="dev" style="font-size: 11px; font-weight: 600; color: #6B6459;">बिल</span>
    </span>
    <span style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8A958F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V9l5 3V9l5 3V9l6 3v8z"/></svg>
      <span class="dev" style="font-size: 11px; font-weight: 600; color: #6B6459;">कारखाना</span>
    </span>
    <span style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#8A958F" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      <span class="dev" style="font-size: 11px; font-weight: 600; color: #6B6459;">अर्डर</span>
    </span>
  </nav>
</div>
</x-dc>
</body>
</html>
