name: Uptime

# Asks, from GitHub's machines rather than Vercel's, whether the shop answers.
#
# That separation is the whole feature. A checker running inside the app cannot
# observe the app being down, because when the site is down the checker does not
# run either — it records a wall of "up" and misses every outage. The monitoring
# screen showed 0% for months for exactly this reason: nothing had ever written
# a reading.
#
# WHY TWO SCHEDULES, AND NOT ONE EVERY FIVE MINUTES
#
# This repository is private, and GitHub gives a private repo 2,000 free Action
# minutes a month. Every run is billed as a whole minute however short it is, so
# a check every five minutes would cost 8,640 minutes — four times the budget —
# and Actions would simply stop part-way through the month, taking CI with it.
#
# So the checks are spent where they buy something. The shop sells between
# 10:00 and 19:00 Nepal time; an outage then costs a customer, and twenty
# minutes is soon enough to act on. At three in the morning nobody is buying and
# hourly is plenty — it still catches a night-long outage before the shop opens.
#
#   peak   10 hours x 3/hour x 30 =   900
#   quiet  14 hours x 1/hour x 30 =   420
#                                   -----
#                                    1,320 minutes, leaving ~680 for CI
#
# Nepal is UTC+5:45, so 10:00–19:00 NPT is 04:15–13:15 UTC. The windows below
# are rounded outward to whole hours, which starts the busy schedule fifteen
# minutes early rather than fifteen minutes late.
on:
  schedule:
    # Shop hours — every 20 minutes.
    - cron: "*/20 4-13 * * *"
    # Overnight and early morning — hourly.
    - cron: "0 0-3,14-23 * * *"
  # So a person can ask right now, from the Actions tab, without waiting.
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: false

# Nothing here reads or writes the repository. The job talks to the shop and to
# nothing else.
permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    # Longer than the check itself, because a reading taken while the shop is
    # down is retried for a few minutes until there is somewhere to file it.
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No npm install. The probe uses fetch and nothing else — deliberately,
      # so a check running this often does not spend most of its life
      # installing packages, and so this job pulls in no third-party code.
      - name: Ask whether the shop is answering
        env:
          PROBE_URL: ${{ vars.PROBE_URL || 'https://krishoe-website.vercel.app/api/health' }}
          # Writes one uptime row and can do nothing else. Deliberately NOT the
          # database connection string: anything reaching these secrets should
          # not be able to read a single order, wage or customer.
          UPTIME_WRITE_TOKEN: ${{ secrets.UPTIME_WRITE_TOKEN }}

          # Telling the owner. Each channel is skipped when its secrets are
          # absent, so email can run today and WhatsApp can be added the day the
          # Twilio account exists — no code change either time.
          #
          # These live here, beside the checker, rather than in the app, because
          # the message has to go out when the app cannot send anything at all.
          EMAIL_PROVIDER_URL: ${{ secrets.EMAIL_PROVIDER_URL }}
          EMAIL_PROVIDER_TOKEN: ${{ secrets.EMAIL_PROVIDER_TOKEN }}
          EMAIL_SENDER_ADDRESS: ${{ secrets.EMAIL_SENDER_ADDRESS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_NUMBER: ${{ secrets.TWILIO_WHATSAPP_NUMBER }}
          WHATSAPP_ADMIN_NUMBER: ${{ secrets.WHATSAPP_ADMIN_NUMBER }}
        run: node scripts/uptime-probe.mjs
